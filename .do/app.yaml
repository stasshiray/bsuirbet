alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: bsuirbet
    match:
      authority: {}
      path:
        prefix: /
name: bsuirbet-frontend
region: fra
services:
- dockerfile_path: /Dockerfile
  github:
    branch: master
    deploy_on_push: true
    repo: stasshiray/bsuirbet
  http_port: 80
  instance_count: 2
  instance_size_slug: apps-s-1vcpu-1gb
  name: bsuirbet
  source_dir: /