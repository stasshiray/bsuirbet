version: '3.8'

include:
  - docker-compose.yml

services:
  backend:
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile}
    container_name: bsuirbet-backend
    command: ${BACKEND_COMMAND:-npm run dev}
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bsuirbet}:${POSTGRES_PASSWORD:-bsuirbet123}@postgres:5432/${POSTGRES_DB:-bsuirbet}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-bsuirbet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bsuirbet123}
      POSTGRES_DB: ${POSTGRES_DB:-bsuirbet}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
    ports:
      - "${PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    volumes:
      - ./src:/app/src
      - /app/node_modules
    networks:
      - bsuirbet-network
    restart: unless-stopped