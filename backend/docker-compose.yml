version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: bsuirbet-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bsuirbet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bsuirbet123}
      POSTGRES_DB: ${POSTGRES_DB:-bsuirbet}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bsuirbet}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bsuirbet-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bsuirbet-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@bsuirbet.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bsuirbet-network
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.2
    container_name: bsuirbet-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-bsuirbet}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-bsuirbet123}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
    ports:
      - "${KEYCLOAK_PORT:-4000}:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bsuirbet-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  bsuirbet-network:
    driver: bridge

