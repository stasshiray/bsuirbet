version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bsuirbet-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bsuirbet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bsuirbet123}
      POSTGRES_DB: ${POSTGRES_DB:-bsuirbet}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bsuirbet}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bsuirbet-network

  # backend:
