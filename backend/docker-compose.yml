  #     PORT: ${PORT:-3001}
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-bsuirbet}:${POSTGRES_PASSWORD:-bsuirbet123}@postgres:5432/${POSTGRES_DB:-bsuirbet}
  #     POSTGRES_HOST: postgres
  #     POSTGRES_PORT: 5432
  #     POSTGRES_USER: ${POSTGRES_USER:-bsuirbet}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bsuirbet123}
  #     POSTGRES_DB: ${POSTGRES_DB:-bsuirbet}
  #   ports:
  #     - "${PORT:-3001}:3001"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   volumes:
  #     - ./src:/app/src
  #     - /app/node_modules
  #   networks:
  #     - bsuirbet-network
  #   restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bsuirbet-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@bsuirbet.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bsuirbet-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  bsuirbet-network:
    driver: bridge

